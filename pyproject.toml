[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliome-mcp"
version = "0.3.0"
description = "MCP connector for Bibliome's local PDF search — requires Bibliome (Mac App Store) installed"
readme = "README.md"
license = {text = "MIT"}
# 3.10, not 3.9: `mcp>=2.0` itself requires 3.10 (read off PyPI, 2026-09-12). Claiming
# 3.9 let the macOS system python3 (3.9.6) resolve this package and then fail on a
# dependency with "no matching distribution for mcp", naming the wrong culprit.
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "fastembed>=0.3.0", "numpy"]

[project.optional-dependencies]
# On-device RAG answers (ask_library) via Apple MLX — matches Bibliome's own
# default provider. Apple Silicon only.
ask-mlx = ["mlx>=0.31", "mlx-lm>=0.31", "transformers<5.13.0"]
# Alternative RAG provider: a local Ollama daemon instead of MLX. Works on
# Intel Macs too. Also set PDF_ASK_PROVIDER=ollama.
ask-ollama = ["ollama>=0.4.0"]
# Test suite (tests/). pytest-asyncio is required, not optional decoration —
# the protocol tests are `async def` and use mcp's own in-memory Client;
# without it pytest silently never runs their bodies at all.
test = ["pytest", "pytest-asyncio"]

[project.scripts]
bibliome-mcp = "bibliome_mcp.server:main"

[project.urls]
Homepage = "https://github.com/negativetime/bibliome-mcp"

[tool.setuptools.packages.find]
include = ["bibliome_mcp*"]
